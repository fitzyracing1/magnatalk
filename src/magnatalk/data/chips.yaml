# magnatalk chip catalog
#
# To add a new chip: append an entry under `chips:` following the same shape,
# then run `magnatalk validate`.
#
# Rules enforced by `magnatalk validate`:
#   - every chip needs: id (unique, kebab-case), name, vendor, memory_gb,
#     memory_bandwidth_gbps, supported_precisions, spec_source
#   - throughput fields (fp16_tflops, bf16_tflops, fp8_tflops) are DENSE
#     tensor throughput; use null when the chip/vendor does not publish one
#   - every offer with a non-null price_per_hour_usd MUST carry price_date
#     (YYYY-MM-DD) and source (the public pricing page URL).
#     Never put an invented/estimated number in price_per_hour_usd.
#   - a chip with no current rental offers keeps `offers: []` (it can still
#     be listed and compared on specs, it just cannot be picked).

schema_version: 1

chips:
