name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev,mcp]
      - name: Lint
        run: ruff check .
      - name: Validate chip catalog
        run: magnatalk validate
      - name: Tests
        run: pytest -v
      - name: Example picks (smoke)
        run: |
          for job in examples/*.yaml; do
            echo "=== $job ==="
            magnatalk pick "$job" --no-log
            echo
          done
